<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0E17;
    --blue: #2E86FF;
    --blue-dim: rgba(46, 134, 255, 0.35);
    --yellow: #F5C518;
    --text: #E8ECF4;
    --muted: #7C8AA0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: var(--bg);
    overflow: hidden;
    position: relative;
    font-family: -apple-system, sans-serif;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--blue-dim) 1px, transparent 1px),
      linear-gradient(90deg, var(--blue-dim) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 88%);
            mask-image: linear-gradient(to bottom, black, transparent 88%);
  }
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 15% 10%, rgba(46,134,255,0.16), transparent 55%);
  }
  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
  }
  .corner.tl { top: 40px; left: 40px; border-top: 3px solid var(--blue); border-left: 3px solid var(--blue); }
  .corner.br { bottom: 40px; right: 40px; border-bottom: 3px solid var(--blue); border-right: 3px solid var(--blue); }
  .content {
    position: relative;
    z-index: 1;
    padding: 80px 90px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.04em;
    color: #fff;
    margin-bottom: 48px;
  }
  .logo .dot { color: var(--yellow); }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 24px;
  }
  .eyebrow::before { content: '// '; color: var(--muted); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 64px;
    line-height: 1.15;
    color: #fff;
    max-width: 900px;
    margin-bottom: 28px;
  }
  .tagline {
    font-family: -apple-system, sans-serif;
    font-size: 24px;
    color: var(--muted);
    max-width: 720px;
  }
  .accent-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: var(--yellow);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="corner tl"></div>
  <div class="corner br"></div>
  <div class="content">
    <div class="logo">JACQUEZ<span class="dot">.</span>MONROE</div>
    <div class="eyebrow">web developer</div>
    <h1>I build clean, fast, and usable things for the web.</h1>
    <div class="tagline">Portfolio of React, JavaScript, and PWA projects — plus in-depth case studies.</div>
  </div>
  <div class="accent-bar"></div>
</body>
</html>
